<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opportunity Radar - Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container py-4" style="max-width: 900px">
      <div class="topbar">
        <a class="logo" href="index.html">Opportunity<span>Radar</span></a>
        <ul class="nav nav-pills" id="nav"></ul>
      </div>

      <section class="hero small">
        <h1>Admin panel</h1>
        <p>
          Add listings the scrapers miss, such as college events or forwarded
          opportunities.
        </p>
      </section>

      <div id="denied" class="alert alert-warning d-none">
        This page is for admins only.
        <a href="matches.html" class="alert-link">Back to my matches</a>
      </div>

      <div class="row g-3" id="panel">
        <div class="col-md-5">
          <div class="card">
            <div class="card-body p-4">
              <h2 class="h6 mb-3">Add an opportunity</h2>
              <div class="mb-3">
                <input
                  type="text"
                  id="oppTitle"
                  class="form-control"
                  placeholder="Title"
                />
              </div>
              <div class="mb-3">
                <select id="oppType" class="form-select">
                  <option value="hackathon">Hackathon</option>
                  <option value="internship">Internship</option>
                  <option value="competition">Competition</option>
                  <option value="contest">Contest</option>
                </select>
              </div>
              <div class="mb-3">
                <input
                  type="text"
                  id="oppSkills"
                  class="form-control"
                  placeholder="Skills (at least 2, comma-separated)"
                />
              </div>
              <div class="mb-3">
                <label for="oppDeadline" class="form-label small text-secondary"
                  >Deadline</label
                >
                <input type="date" id="oppDeadline" class="form-control" />
              </div>
              <div class="mb-3">
                <input
                  type="url"
                  id="oppLink"
                  class="form-control"
                  placeholder="Link (optional), https://..."
                />
              </div>
              <button class="btn btn-primary w-100" onclick="addOpportunity()">
                Add opportunity
              </button>
              <div id="addOppResult" class="mt-3"></div>
            </div>
          </div>
        </div>

        <div class="col-md-7">
          <div class="card h-100">
            <div class="card-body p-4">
              <h2 class="h6 mb-3">
                Recently added
                <span id="count" class="text-secondary fw-normal"></span>
              </h2>
              <div id="recent" class="small text-secondary">Loading...</div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="auth.js"></script>
    <script>
      if (!getToken()) location.href = "login.html";
      renderNav("admin");
      if (!isAdmin()) {
        document.getElementById("denied").classList.remove("d-none");
        document.getElementById("panel").classList.add("d-none");
      }

      const TYPE_COLORS = {
        hackathon: "primary",
        internship: "info",
        competition: "warning",
        contest: "success",
      };

      function show(kind, text) {
        document.getElementById("addOppResult").innerHTML =
          `<div class="alert alert-${kind} mb-0">${esc(text)}</div>`;
      }

      async function loadRecent() {
        const box = document.getElementById("recent");
        try {
          const list = await (await fetch(API + "/opportunities")).json();
          document.getElementById("count").textContent =
            `(${list.length} total)`;
          box.innerHTML = list
            .slice()
            .sort((a, b) => b.id - a.id)
            .slice(0, 8)
            .map(
              (o) => `
          <div class="d-flex justify-content-between align-items-center border-bottom py-2 gap-2">
            <div class="text-truncate">
              <span class="text-body fw-semibold">${esc(o.title)}</span><br>
              <span class="text-secondary">${esc(o.deadline)}</span>
            </div>
            <span class="badge text-bg-${TYPE_COLORS[o.type] || "secondary"} text-capitalize">${esc(o.type)}</span>
          </div>`,
            )
            .join("");
        } catch (e) {
          box.textContent = "Could not load. Is the backend running?";
        }
      }

      async function addOpportunity() {
        const title = document.getElementById("oppTitle").value;
        const type = document.getElementById("oppType").value;
        const skills = document.getElementById("oppSkills").value;
        const deadline = document.getElementById("oppDeadline").value;
        const link = document.getElementById("oppLink").value;
        if (!title || !skills || !deadline) {
          show("warning", "Please fill in title, skills and deadline.");
          return;
        }
        show("secondary", "Adding...");
        try {
          const params = new URLSearchParams({
            title,
            type,
            skills,
            deadline,
            link,
          });
          const res = await api("/opportunities?" + params, { method: "POST" });
          const data = await res.json();
          if (!res.ok) {
            show(
              "danger",
              typeof data.detail === "string"
                ? data.detail
                : "Could not add opportunity.",
            );
            return;
          }
          show("success", `Added "${data.title}" successfully!`);
          ["oppTitle", "oppSkills", "oppDeadline", "oppLink"].forEach(
            (id) => (document.getElementById(id).value = ""),
          );
          loadRecent();
        } catch (e) {
          show("danger", "Failed to add opportunity. Is the backend running?");
        }
      }

      if (isAdmin()) loadRecent();
    </script>
  </body>
</html>

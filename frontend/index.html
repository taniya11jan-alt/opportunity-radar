<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Opportunity Radar</title>
  <style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    max-width: 750px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f4f6f8;
    color: #1a1a1a;
  }
  h1 {
    color: #1a1a2e;
    margin-bottom: 4px;
  }
  .subtitle {
    color: #666;
    margin-bottom: 24px;
  }
  .panel {
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .panel h2 {
    margin-top: 0;
    font-size: 18px;
    color: #1a1a2e;
  }
  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
  }
  button {
    background: #4a47a3;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover {
    background: #3a3880;
  }
  .match-card {
    background: white;
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    border-left: 4px solid #ddd;
  }
  .match-card.high { border-left-color: #22a35e; }
  .match-card.medium { border-left-color: #e3a008; }
  .match-card.low { border-left-color: #ccc; }
  .match-card h3 {
    margin: 0 0 6px 0;
    font-size: 16px;
  }
  .meta {
    color: #777;
    font-size: 13px;
    margin: 4px 0;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    background: #eee;
    color: #444;
    text-transform: capitalize;
  }
  .score {
    font-weight: bold;
    font-size: 14px;
  }
  .breakdown {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}
  .score.high { color: #22a35e; }
  .score.medium { color: #c78a00; }
  .score.low { color: #999; }
</style>
</head>
<body>
  <h1>Opportunity Radar</h1>

  <div class="card">
    <h2>New here? Sign up</h2>
    <input type="text" id="name" placeholder="Full name" /><br><br>
    <input type="email" id="email" placeholder="Email" /><br><br>
    <input type="text" id="year" placeholder="Year (e.g. 3rd year)" /><br><br>
    <input type="text" id="skills" placeholder="Skills (comma-separated, e.g. python,sql)" /><br><br>
    <button onclick="signup()">Sign Up</button>
    <p id="signupResult"></p>
  </div>

  <div class="card">
    <h2>Already signed up? Find your matches</h2>
    <input type="number" id="studentId" placeholder="Your student ID" />
    <button onclick="loadMatches()">Find Matches</button>
  </div>

  <div id="results"></div>

  <script>
    async function signup() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const year = document.getElementById("year").value;
      const skills = document.getElementById("skills").value;
      const resultEl = document.getElementById("signupResult");

      if (!name || !email || !year || !skills) {
        resultEl.innerHTML = "Please fill in all fields.";
        return;
      }

      resultEl.innerHTML = "Signing up...";

      try {
        const params = new URLSearchParams({ name, email, year, skills });
        const response = await fetch(`http://127.0.0.1:8000/students?${params}`, {
          method: "POST"
        });
        const data = await response.json();

        resultEl.innerHTML = `Signed up! Your student ID is <strong>${data.id}</strong>. Use it below to see your matches.`;
        document.getElementById("studentId").value = data.id;
      } catch (err) {
        resultEl.innerHTML = "Signup failed. Is the backend running?";
      }
    }

    async function loadMatches() {
      const studentId = document.getElementById("studentId").value;
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "Loading...";

      try {
        const response = await fetch(`http://127.0.0.1:8000/students/${studentId}/matches`);
        const data = await response.json();

        if (data.error) {
          resultsDiv.innerHTML = `<p>${data.error}</p>`;
          return;
        }

        resultsDiv.innerHTML = `<h2>Matches for ${data.student}</h2>`;
        data.matches.forEach(match => {
  let level = "low";
  if (match.match_score >= 0.6) level = "high";
  else if (match.match_score >= 0.3) level = "medium";

  resultsDiv.innerHTML += `
    <div class="match-card ${level}">
      <h3>${match.title}</h3>
      <p class="meta"><span class="badge">${match.type}</span> &nbsp; Deadline: ${match.deadline}</p>
      <p class="score ${level}">Match Score: ${Math.round(match.match_score * 100)}%</p>
      <p class="breakdown">Skill fit: ${Math.round(match.skill_score * 100)}% &nbsp; | &nbsp; Urgency: ${Math.round(match.urgency_score * 100)}%</p>
    </div>
  `;
});
      } catch (err) {
        resultsDiv.innerHTML = "Error loading matches. Is the backend server running?";
      }
    }
  </script>
</body>
</html>

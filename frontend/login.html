<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opportunity Radar - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container py-4" style="max-width: 900px">
      <div class="topbar">
        <a class="logo" href="index.html">Opportunity<span>Radar</span></a>
        <ul class="nav nav-pills" id="nav"></ul>
      </div>

      <section class="hero small">
        <h1>Welcome back</h1>
        <p>Log in to see opportunities ranked for you.</p>
      </section>

      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card">
            <div class="card-body p-4">
              <div class="mb-3">
                <label class="form-label small text-secondary">Email</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  placeholder="you@example.com"
                />
              </div>
              <div class="mb-3">
                <label class="form-label small text-secondary">Password</label>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="Your password"
                />
              </div>
              <button class="btn btn-primary w-100" onclick="login()">
                Log in
              </button>
              <div id="result" class="mt-3"></div>
              <p class="small text-secondary mt-3 mb-0">
                New here? <a href="signup.html">Create an account</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="auth.js"></script>
    <script>
      renderNav("login");
      if (getToken()) location.href = "matches.html";

      function show(kind, text) {
        document.getElementById("result").innerHTML =
          `<div class="alert alert-${kind} mb-0">${esc(text)}</div>`;
      }

      async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        if (!email || !password) {
          show("warning", "Enter your email and password.");
          return;
        }
        show("secondary", "Logging in...");
        try {
          const res = await fetch(API + "/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const data = await res.json();
          if (!res.ok) {
            show("danger", data.detail || "Login failed.");
            return;
          }
          saveSession(data);
          location.href = "matches.html";
        } catch (e) {
          show("danger", "Could not reach the server. Is the backend running?");
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") login();
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opportunity Radar - Profile</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container py-4" style="max-width: 900px">
      <div class="topbar">
        <a class="logo" href="index.html">Opportunity<span>Radar</span></a>
        <ul class="nav nav-pills" id="nav"></ul>
      </div>

      <section class="hero small">
        <h1>Your profile</h1>
        <p>Update your skills any time. Your matches change with them.</p>
      </section>

      <div class="row justify-content-center">
        <div class="col-md-7">
          <div class="card">
            <div class="card-body p-4">
              <div class="mb-3">
                <label class="form-label small text-secondary">Email</label>
                <input type="email" id="email" class="form-control" disabled />
              </div>
              <div class="mb-3">
                <label class="form-label small text-secondary">Full name</label>
                <input type="text" id="name" class="form-control" />
              </div>
              <div class="mb-3">
                <label class="form-label small text-secondary">Year</label>
                <input type="text" id="year" class="form-control" />
              </div>
              <div class="mb-3">
                <label class="form-label small text-secondary"
                  >Skills (at least 2, comma-separated)</label
                >
                <input type="text" id="skills" class="form-control" />
              </div>
              <div class="mb-3">
                <label class="form-label small text-secondary"
                  >New password (leave empty to keep the current one)</label
                >
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  autocomplete="new-password"
                />
              </div>
              <button class="btn btn-primary w-100" onclick="saveProfile()">
                Save changes
              </button>
              <div id="result" class="mt-3"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>Opportunity Radar &middot; Minor project</footer>

    <script src="auth.js"></script>
    <script>
      function show(kind, text) {
        const el = document.getElementById("result");
        el.innerHTML = `<div class="alert alert-${kind} mb-0"></div>`;
        el.firstChild.textContent = text;
      }

      async function loadProfile() {
        try {
          const res = await authFetch("/me");
          const d = await res.json();
          document.getElementById("email").value = d.email;
          document.getElementById("name").value = d.name;
          document.getElementById("year").value = d.year;
          document.getElementById("skills").value = d.skills;
        } catch (e) {
          if (e.message === "Not logged in") return;
          show(
            "danger",
            "Could not load your profile. Is the backend running?",
          );
        }
      }

      async function saveProfile() {
        const name = document.getElementById("name").value.trim();
        const year = document.getElementById("year").value.trim();
        const skills = document.getElementById("skills").value.trim();
        const password = document.getElementById("password").value;

        if (!name || !year || !skills) {
          show("warning", "Name, year and skills cannot be empty.");
          return;
        }
        show("secondary", "Saving...");
        try {
          const res = await authFetch("/me", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name,
              year,
              skills,
              password: password || null,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            show("danger", data.detail || "Could not save changes.");
            return;
          }
          localStorage.setItem("name", data.name);
          document.getElementById("password").value = "";
          renderNav("profile");
          show("success", "Saved. Your matches now use your updated skills.");
        } catch (e) {
          if (e.message === "Not logged in") return;
          show("danger", "Could not save. Is the backend running?");
        }
      }

      if (requireLogin()) {
        renderNav("profile");
        loadProfile();
      }
    </script>
  </body>
</html>
